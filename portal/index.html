<!DOCTYPE html>
<!--
  v1.38: the installable phone app for FOHMS Volunteer Portal. scripts/build-pwa.sh fills in the parts in double braces.
  It shows the live Apps Script app full-screen (with ?embed=1&pwa=1), a start-up screen while it loads,
  a friendly page when the phone is offline, and how to add it to the home screen when opened in a browser.
  Nothing personal is stored here: signing in happens inside the app, as on the web.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>FOHMS Volunteer Portal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#32215C">
  <meta name="description" content="Your events, shifts, meetings and claims as a FOHMS volunteer.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="FOHMS Portal">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="../icons/events-192.png">
  <link rel="apple-touch-icon" href="../icons/events-180.png">
  <style>
    .hidden { display: none !important; }
    html, body { margin: 0; height: 100%; background: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; color: #32215C; }
    html, body { overscroll-behavior: none; overflow: hidden; }
    /* the app fills the screen, inside the phone's safe area (notch and home bar) */
    /* v1.41.3: the app runs right down to the bottom edge; its bottom tabs pad themselves above the home bar (told the size with ?sb=),
       so there's no white strip under the tabs. A box that stretches (an iframe on its own doesn't) holds it. */
    #appWrap { position: fixed; top: env(safe-area-inset-top, 0px); left: env(safe-area-inset-left, 0px); right: env(safe-area-inset-right, 0px); bottom: 0; overflow: hidden; background: #fff; }
    #app { width: 100%; height: 100%; border: 0; display: block; background: #f7f6fa; opacity: 0; transition: opacity .25s ease-out; }
    #sbProbe { position: fixed; bottom: 0; left: 0; width: 1px; height: env(safe-area-inset-bottom, 0px); visibility: hidden; pointer-events: none; }
    #app.ready { opacity: 1; }
    /* v1.42: the start-up and offline screens in the FOHMS colours (the apps' purple and teal) */
    .screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center; background: #32215C; color: #fff; transition: opacity .25s ease-out; border-bottom: 6px solid #21BBBE; }
    .screen.hidden { display: none; }
    .screen.fade { opacity: 0; pointer-events: none; }
    .screen img { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 6px 24px rgba(0,0,0,.25); }
    .screen h1 { margin: 4px 0 0; font-size: 22px; }
    .screen p { margin: 0; color: #e4def2; font-size: 16px; line-height: 1.45; max-width: 320px; }
    .dots::after { content: '…'; }
    @media (prefers-reduced-motion: no-preference) {
      @keyframes bob { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-6px) rotate(2deg); } }
      #splash img { animation: bob 1.8s ease-in-out infinite; }
      .dots::after { content: ''; animation: dots 1.4s steps(1, end) infinite; }
      @keyframes dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }
    }
    .screen button { font: inherit; font-weight: 700; font-size: 16px; min-height: 48px; padding: 0 22px; border-radius: 8px; border: 0; background: #21BBBE; color: #1f1a2e; cursor: pointer; }
    .slow { min-height: 1.4em; font-size: 14px !important; }
    /* "add to your home screen", shown only in a browser tab */
    #install { position: fixed; left: 10px; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); z-index: 5; background: #32215C; color: #fff; border-radius: 12px; padding: 12px 14px; display: flex; gap: 12px; align-items: center; box-shadow: 0 8px 30px rgba(31,26,46,.3); font-size: 15px; line-height: 1.35; }
    #install.hidden { display: none; }
    #install img { width: 40px; height: 40px; border-radius: 9px; flex: 0 0 auto; }
    #install .t { flex: 1 1 auto; }
    #install button { font: inherit; font-weight: 700; border-radius: 8px; min-height: 40px; padding: 0 12px; border: 0; cursor: pointer; }
    #installGo { background: #21BBBE; color: #fff; }
    #installX { background: transparent; color: #fff; font-size: 22px; padding: 0 6px !important; }
    .share { display: inline-block; width: 16px; height: 16px; vertical-align: -3px; }
  </style>
</head>
<body>
  <div id="appWrap"><iframe id="app" title="FOHMS Volunteer Portal" allow="camera; microphone; clipboard-read; clipboard-write; web-share; fullscreen" referrerpolicy="strict-origin-when-cross-origin"></iframe></div>
  <div id="sbProbe" aria-hidden="true"></div>

  <div class="screen" id="splash" role="status" aria-live="polite">
    <img src="../icons/events-192.png" alt="">
    <h1>FOHMS Volunteer Portal</h1>
    <p>Opening<span class="dots"></span></p>
    <p class="slow" id="slow"></p>
  </div>

  <div class="screen hidden" id="offline" role="alert">
    <img src="../icons/events-192.png" alt="">
    <h1>You're offline</h1>
    <p>FOHMS Volunteer Portal needs the internet to show and save things. Check your Wi-Fi or mobile data, then try again.</p>
    <button type="button" id="retry">Try again</button>
  </div>

  <div id="install" class="hidden" role="region" aria-label="Add to your home screen">
    <img src="../icons/events-192.png" alt="">
    <div class="t" id="installText"></div>
    <button type="button" id="installGo" class="hidden">Install</button>
    <button type="button" id="installX" aria-label="Not now">×</button>
  </div>

  <script>
    (function () {
      var EXEC = 'https://script.google.com/macros/s/AKfycbx6Si0-ZysmONK0riRLrvPXeBVyG6JBwo83MzhOt2UtVILIeNTGHIC8mJdDqpEaE8v2Uw/exec';
      var KEY = 'events';
      var $ = function (id) { return document.getElementById(id); };
      var frame = $('app'), splash = $('splash'), offline = $('offline');
      var standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;

      // Pass on anything after the address (e.g. ?tab=approvals), never our own switches
      function src() {
        var p = new URLSearchParams(location.search), q = new URLSearchParams();
        p.forEach(function (v, k) { if (k !== 'embed' && k !== 'pwa' && k !== 'sb') q.set(k, v); });
        q.set('embed', '1'); q.set('pwa', '1');
        // v1.41.3: the height of the phone's home bar area, so the app's bottom tabs can sit just above it
        var sb = 0; try { sb = Math.round($('sbProbe').getBoundingClientRect().height) || 0; } catch (e) {}
        q.set('sb', String(Math.max(0, Math.min(60, sb))));
        return EXEC + (EXEC.indexOf('?') >= 0 ? '&' : '?') + q.toString();
      }
      var slowT = null, loaded = false;
      function open() {
        if (!navigator.onLine) return showOffline();
        offline.classList.add('hidden'); splash.classList.remove('hidden', 'fade'); $('slow').textContent = '';
        loaded = false; frame.classList.remove('ready');
        clearTimeout(slowT); slowT = setTimeout(function () { if (!loaded) $('slow').textContent = 'Taking a little while. Hold tight.'; }, 6000);
        frame.src = src();
      }
      function showOffline() { clearTimeout(slowT); splash.classList.add('hidden'); offline.classList.remove('hidden'); }
      frame.addEventListener('load', function () {
        if (!frame.src || frame.src === 'about:blank') return;
        loaded = true; clearTimeout(slowT);
        frame.classList.add('ready'); splash.classList.add('fade');
        setTimeout(function () { splash.classList.add('hidden'); }, 300);
      });
      // v1.52.4: "Keep me signed in". An iPhone forgets what the app saves inside Google's frame when the app is closed,
      // so this page keeps the 30-day session (only if they ticked Keep me signed in) and hands it back when the app opens.
      // It only talks to the Google Apps Script frame this page itself opens (see fromOurFrame).
      var TK = 'fohmsTodo_' + KEY;   // v1.57.0
      var SK = 'fohmsSess_' + KEY, FROM = /^https:\/\/[a-z0-9-]+\.googleusercontent\.com$/i, KEEP_MS = 30 * 86400000;
      // v1.53.0 (security): only the portal inside THIS page's own frame is answered. Any Google script page has a
      // googleusercontent.com address, so the address alone isn't enough: another page that opened this app in a new
      // window could have asked for the session. The sender must be our frame, or a frame inside it.
      function fromOurFrame(src) {
        try { var ours = frame.contentWindow, w = src; for (var i = 0; i < 8 && w; i++) { if (w === ours) return true; if (w.parent === w) return false; w = w.parent; } } catch (x) {}
        return false;
      }
      window.addEventListener('message', function (e) {
        var d = e.data; if (!FROM.test(e.origin) || !d || d.fohms !== 1 || !fromOurFrame(e.source)) return;
        try {
          if (d.type === 'keep' && typeof d.s === 'string' && d.s.length >= 40 && d.s.length <= 200) localStorage.setItem(SK, JSON.stringify({ s: d.s, at: Date.now() }));
          else if (d.type === 'forget') { localStorage.removeItem(SK); localStorage.removeItem(TK); }
          // v1.57.0: the last "My to-dos" count, so Home can show it at once when the app opens (a number, nothing else)
          else if (d.type === 'todoKeep' && typeof d.id === 'string' && d.id.length <= 20 && typeof d.n === 'number' && d.n >= 0 && d.n < 10000) localStorage.setItem(TK, JSON.stringify({ id: d.id, n: Math.floor(d.n) }));
          else if (d.type === 'todoNeed' && typeof d.id === 'string') {
            var t = null; try { t = JSON.parse(localStorage.getItem(TK) || 'null'); } catch (x) {}
            e.source.postMessage({ fohms: 1, type: 'todo', n: t && t.id === d.id ? t.n : null }, e.origin);
          }
          else if (d.type === 'need') {
            var o = null; try { o = JSON.parse(localStorage.getItem(SK) || 'null'); } catch (x) {}
            var s = o && o.s && Date.now() - o.at < KEEP_MS ? o.s : null;
            if (!s) localStorage.removeItem(SK);
            e.source.postMessage({ fohms: 1, type: 'session', s: s }, e.origin);
          }
        } catch (x) { /* storage off: they just sign in */ }
      });
      $('retry').addEventListener('click', open);
      window.addEventListener('online', function () { if (!loaded || !offline.classList.contains('hidden')) open(); });
      window.addEventListener('offline', function () { if (!loaded) showOffline(); });
      open();

      // Keep the start-up files for offline starts
      if ('serviceWorker' in navigator) { try { navigator.serviceWorker.register('sw.js'); } catch (e) {} }

      // In a browser tab (not yet on the home screen): how to add it
      var seen = false; try { seen = localStorage.getItem('fohmsInstallSeen_' + KEY) === '1'; } catch (e) {}
      var ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      var deferred = null;
      function showInstall(html, canInstall) {
        if (standalone || seen) return;
        $('installText').innerHTML = html; $('installGo').classList.toggle('hidden', !canInstall); $('install').classList.remove('hidden');
      }
      $('installX').addEventListener('click', function () { $('install').classList.add('hidden'); try { localStorage.setItem('fohmsInstallSeen_' + KEY, '1'); } catch (e) {} });
      window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferred = e; showInstall('<b>Add FOHMS Portal to your home screen</b><br>It opens full-screen, like an app.', true); });
      $('installGo').addEventListener('click', function () { if (!deferred) return; deferred.prompt(); deferred.userChoice.then(function () { $('install').classList.add('hidden'); deferred = null; }); });
      if (ios && !standalone) setTimeout(function () {
        showInstall('<b>Add FOHMS Portal to your home screen</b><br>Tap <svg class="share" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-label="Share"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M5 11v9h14v-9"/></svg> Share, then <b>Add to Home Screen</b>.', false);
      }, 1500);
    })();
  </script>
</body>
</html>
